name: Validate Skills

on:
  pull_request:
    paths:
      - '*/skills/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-validation')"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Install skill-validator
        run: go install github.com/dacharyc/skill-validator@v0.6.1

      - name: Detect changed skills
        id: changed
        run: |
          # Skills live at <plugin-folder>/skills/<skill-name>/…
          CHANGED_SKILLS=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD \
            | grep -E '^[^/]+/skills/[^/]+/' | cut -d'/' -f1-3 | sort -u | tr '\n' ' ')
          echo "skills=$CHANGED_SKILLS" >> "$GITHUB_OUTPUT"
          echo "Changed skills: $CHANGED_SKILLS"

      - name: Validate changed skills
        if: steps.changed.outputs.skills != ''
        run: |
          EXIT=0
          for SKILL in ${{ steps.changed.outputs.skills }}; do
            echo "::group::Validating $SKILL"
            skill-validator check "$SKILL" || EXIT=1
            echo "::endgroup::"
          done
          exit $EXIT

      - name: Analyze content
        if: steps.changed.outputs.skills != '' && !cancelled()
        run: |
          for SKILL in ${{ steps.changed.outputs.skills }}; do
            echo "::group::Content analysis: $SKILL"
            skill-validator analyze content "$SKILL" || true
            echo "::endgroup::"
          done
