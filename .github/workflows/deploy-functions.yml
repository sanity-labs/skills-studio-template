name: Deploy Functions
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'sanity.blueprint.ts'
      - 'studio/skills.config.ts'
      - 'studio/utils/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    # Skipped until the Functions are set up (see README § Deploy the GitHub sync).
    if: ${{ vars.SANITY_BLUEPRINT_STACK_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # The blueprint sits at the repo root next to pnpm-lock.yaml, so the CLI
      # detects pnpm. The Functions import shared code from studio/utils, so
      # install the whole workspace.
      - run: pnpm install --frozen-lockfile
      - run: npx sanity@latest blueprints deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
          # Repository variables (Settings → Secrets and variables → Actions → Variables).
          # The stack ID is printed by `npx sanity blueprints init` / `blueprints info`.
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_ORGANIZATION_ID: ${{ vars.SANITY_ORGANIZATION_ID }}
          SANITY_BLUEPRINT_STACK_ID: ${{ vars.SANITY_BLUEPRINT_STACK_ID }}
          SANITY_ASSET_TIMEOUT: 120
